  <div class="article-content">
    <h2 id="封装socket"><a href="#封装socket" class="headerlink" title="封装socket"></a>封装socket</h2><figure class="highlight html"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line">socket如何封装呢 const ws = new WebSocket(&#x27;ws://example.com/socket&#x27;);</span><br><span class="line">ws分别有四个事件：onopen 、onmessage 、onclose 、onerror 。</span><br><span class="line">代表着连接成功、收到消息、断开连接和发生错误，当某个事件发生时，就会触发对应的回调函数。</span><br><span class="line">同时心跳机制是必须的，不然服务器会认为客户端已经断开连接。 那我们就开始封装吧</span><br></pre></td></tr></table></figure>

>61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br><span class="line">91</span><br><span class="line">92</span><br><span class="line">93</span><br><span class="line">94</span><br><span class="line">95</span><br><span class="line">96</span><br><span class="line">97</span><br><span class="line">98</span><br><span class="line">99</span><br><span class="line">100</span><br><span class="line">101</span><br><span class="line">102</span><br><span class="line">103</span><br><span class="line">104</span><br><span class="line">105</span><br><span class="line">106</span><br><span class="line">107</span><br><span class="line">108</span><br><span class="line">109</span><br><span class="line">110</span><br><span class="line">111</span><br><span class="line">112</span><br><span class="line">113</span><br><span class="line">114</span><br><span class="line">115</span><br><span class="line">116</span><br><span class="line">117</span><br><span class="line">118</span><br><span class="line">119</span><br><span class="line">120</span><br><span class="line">121</span><br><span class="line">122</span><br><span class="line">123</span><br><span class="line">124</span><br><span class="line">125</span><br><span class="line">126</span><br><span class="line">127</span><br><span class="line">128</span><br><span class="line">129</span><br><span class="line">130</span><br><span class="line">131</span><br><span class="line">132</span><br><span class="line">133</span><br><span class="line">134</span><br><span class="line">135</span><br><span class="line">136</span><br><span class="line">137</span><br><span class="line">138</span><br><span class="line">139</span><br><span class="line">140</span><br><span class="line">141</span><br><span class="line">142</span><br><span class="line">143</span><br><span class="line">144</span><br><span class="line">145</span><br><span class="line">146</span><br><span class="line">147</span><br><span class="line">148</span><br><span class="line">149</span><br><span class="line">150</span><br><span class="line">151</span><br><span class="line">152</span><br><span class="line">153</span><br><span class="line">154</span><br><span class="line">155</span><br><span class="line">156</span><br><span class="line">157</span><br><span class="line">158</span><br><span class="line">159</span><br><span class="line">160</span><br><span class="line">161</span><br><span class="line">162</span><br><span class="line">163</span><br><span class="line">164</span><br><span class="line">165</span><br><span class="line">166</span><br><span class="line">167</span><br><span class="line">168</span><br><span class="line">169</span><br><span class="line">170</span><br><span class="line">171</span><br><span class="line">172</span><br><span class="line">173</span><br><span class="line">174</span><br><span class="line">175</span><br><span class="line">176</span><br><span class="line">177</span><br><span class="line">178</span><br><span class="line">179</span><br><span class="line">180</span><br><span class="line">181</span><br><span class="line">182</span><br><span class="line">183</span><br><span class="line">184</span><br><span class="line">185</span><br><span class="line">186</span><br><span class="line">187</span><br><span class="line">188</span><br><span class="line">189</span><br><span class="line">190</span><br><span class="line">191</span><br><span class="line">192</span><br><span class="line">193</span><br><span class="line">194</span><br><span class="line">195</span><br><span class="line">196</span><br><span class="line">197</span><br><span class="line">198</span><br><span class="line">199</span><br><span class="line">200</span><br><span class="line">201</span><br><span class="line">202</span><br><span class="line">203</span><br><span class="line">204</span><br><span class="line">205</span><br><span class="line">206</span><br><span class="line">207</span><br></pre></td><td class="code"><pre><span class="line">const defaultServer =</span><br><span class="line">  import.meta.env.VITE_SERVER_IP !== &quot;&quot;</span><br><span class="line">    ? `ws://$&#123;import.meta.env.VITE_SERVER_IP&#125;/ws/audio`</span><br><span class="line">    : `ws://$&#123;location.host&#125;/ws/audio`// 默认的服务器地址</span><br><span class="line"></span><br><span class="line">创建一个类</span><br><span class="line">class Socket &#123;</span><br><span class="line">    private ws: WebSocket | null = null; // 私有属性，用于存储WebSocket实例,实例不能被外部访问</span><br><span class="line">    private _url: string; // 私有属性，用于存储WebSocket的url</span><br><span class="line">    private _heartbeatTimer: ReturnType&lt;typeof setInterval&gt; | null = null// 心跳定时器</span><br><span class="line">      // 后端超过多久没响应，就断开连接 */</span><br><span class="line">    private _heartbeatInterval: number</span><br><span class="line">    // 短线重连时常</span><br><span class="line">    private _reconnectInterval: number</span><br><span class="line">      // 如果主动关闭的则不重连</span><br><span class="line">    private _closeForce = false</span><br><span class="line">      // 锁：是否正在等待心跳应答</span><br><span class="line">    private _isWaitingAck: boolean</span><br><span class="line">      // 后端返回超时时间</span><br><span class="line">    private _heartbeatIntervalTime: number | NodeJS.Timeout | undefined</span><br><span class="line">    // 后端返回超时时间</span><br><span class="line">    private _heartbeatIntervalTime: number | NodeJS.Timeout | undefined</span><br><span class="line">    //类的构造函数</span><br><span class="line"></span><br><span class="line">    constructor(options?: AudioSocketOptions) &#123;//外部new的时候可以传入参数，不传就使用默认值</span><br><span class="line"></span><br><span class="line">    this._url = options?.url || defaultServer</span><br><span class="line">    this._heartbeatInterval = options?.heartbeatInterval ?? 3000</span><br><span class="line">    this._reconnectInterval = options?.reconnectInterval ?? 3000</span><br><span class="line">    this._isWaitingAck = false</span><br><span class="line">      /** 当前连接状态 */</span><br><span class="line">  get readyState(): SocketReadyState &#123;</span><br><span class="line">    return (this._ws?.readyState ?? SocketReadyState.CLOSED) as SocketReadyState</span><br><span class="line">  &#125;</span><br><span class="line">    /**</span><br><span class="line">   * 建立连接</span><br><span class="line">   */</span><br><span class="line">    connect() &#123;</span><br><span class="line">    if (this._ws &amp;&amp; this._ws.readyState !== WebSocket.CLOSED) &#123;</span><br><span class="line">      console.warn(&quot;[AudioSocket] 连接已存在或正在连接中&quot;)</span><br><span class="line">      return</span><br><span class="line">    &#125;</span><br><span class="line">    this._closeForce = false</span><br><span class="line">    this._ws = new WebSocket(this._url || defaultServer)</span><br><span class="line">    // this._ws.binaryType = &quot;arraybuffer&quot;</span><br><span class="line"></span><br><span class="line">    this._ws.onopen = this._onOpen.bind(this)// 连接成功回调</span><br><span class="line"></span><br><span class="line">    this._ws.onmessage = this._onMessage.bind(this) // 收到消息回调</span><br><span class="line"></span><br><span class="line">    this._ws.onerror = this._onError.bind(this)// 发生错误回调</span><br><span class="line">    this._ws.onclose = this._onClose.bind(this)// 断开连接回调</span><br><span class="line">  &#125;</span><br><span class="line">   /**</span><br><span class="line">   * 发送数据</span><br><span class="line">   * @param data 要发送的数据，支持 string / ArrayBuffer / Blob / object</span><br><span class="line">   */</span><br><span class="line">  send(data: string | ArrayBuffer | Blob) &#123;</span><br><span class="line">    if (!this._ws || this._ws.readyState !== WebSocket.OPEN) &#123;</span><br><span class="line">      console.warn(&quot;[AudioSocket] 连接未就绪，无法发送数据&quot;)</span><br><span class="line">      return</span><br><span class="line">    &#125;</span><br><span class="line">    this._ws.send(data)</span><br><span class="line">  &#125;</span><br><span class="line">   /**</span><br><span class="line">   * 建立心跳（IAP 二进制封包）</span><br><span class="line">   * 每次心跳前检查上一次是否收到后端响应，连续未响应超过阈值则主动断开触发重连</span><br><span class="line">   */</span><br><span class="line">   //说下思路，当socket连接成功时，会触发这个方法，首先会先把_heartbeatTimer原本的定时器去除掉，因为假设后面又重新连接了，之前的定时器还在的话就会有问题</span><br><span class="line">清除之后，建立一个新的，当查看是否有连接，知道连接后进入查看锁，这个锁的作用是，假设为true的状态下，就是之前已经发过心跳信息给后端了，等待后端回复，在这期间</span><br><span class="line">都不会进行下一步动作，后续就是向后端发送心跳信息，然后设置一个定时器，如果在6秒内没有收到回复的话，就断开连接，并且清除心跳定时器和锁设置为false，以供后续socket重连。</span><br><span class="line">  heartbeat() &#123;</span><br><span class="line">    this._clearHeartbeat()</span><br><span class="line">    this._heartbeatTimer = setInterval(() =&gt; &#123;</span><br><span class="line">      if (!this._ws || this._ws.readyState !== WebSocket.OPEN) &#123;</span><br><span class="line">        return</span><br><span class="line">      &#125;</span><br><span class="line">      if (this._isWaitingAck) return</span><br><span class="line">      const heartBeatMsg = &#123;</span><br><span class="line">        strCmdEnum: &quot;CMD_HEARTBEAT_REQ&quot;,</span><br><span class="line">        Mac: &quot;aa:aa:aa:00:00:01&quot;,</span><br><span class="line">        Type: 1</span><br><span class="line">      &#125;</span><br><span class="line">      const iapBody = jsonToArrayBuffer(heartBeatMsg)</span><br><span class="line">      const iapHead = getIapHead(iapBody.byteLength)</span><br><span class="line">      const iapBuffer = _concatBuffer(iapHead, iapBody)</span><br><span class="line">      this.send(iapBuffer)</span><br><span class="line">      this._isWaitingAck = true // ← 新增：加锁</span><br><span class="line">      this._heartbeatIntervalTime = setTimeout(() =&gt; &#123;</span><br><span class="line">        // ← 新增：超时断开</span><br><span class="line">        if (this._isWaitingAck) &#123;</span><br><span class="line">          console.warn(&quot;[AudioSocket] 后端未响应心跳，断开连接&quot;)</span><br><span class="line">          this._ws?.close()</span><br><span class="line">          this._clearHeartbeat()</span><br><span class="line">          this._isWaitingAck = false</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;, 6000)</span><br><span class="line">      this._emit(&quot;heartbeatSend&quot;)</span><br><span class="line">    &#125;, this._heartbeatInterval)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  //接下来，是多功能监听方法</span><br><span class="line">    /**</span><br><span class="line">   * 监听事件</span><br><span class="line">   * @param event 事件名称</span><br><span class="line">   * @param callback 回调函数</span><br><span class="line">   */</span><br><span class="line">   首先，一个vue组件一开始以on监听，例如监听一个就是叫message，其实on只是把监听后执行的那个方法push到一个map对象里面而已，然后再把这个整体的一个方法数组给set进去，当_emits触发时，例如是后端发送前端socket信息，这时候，接受信息的_onMessage就会触发这个emits方法，并告诉他是message的，然后emits方法就会从map数组里面找到message的方法数组，然后进行遍历，给每个方法传数据</span><br><span class="line">  </span><br><span class="line"></span><br><span class="line">  on(event: string, callback: EventCallback) &#123;</span><br><span class="line">    const callbacks = this._eventMap.get(event) || []</span><br><span class="line">    if (!callbacks.some((fn) =&gt; fn === callback)) &#123;</span><br><span class="line">      callbacks.push(callback)</span><br><span class="line">    &#125;</span><br><span class="line">    this._eventMap.set(event, callbacks)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /**</span><br><span class="line">   * 取消监听事件</span><br><span class="line">   * @param event 事件名称</span><br><span class="line">   * @param callback 回调函数</span><br><span class="line">   */</span><br><span class="line">  off(event: string, callback: EventCallback) &#123;</span><br><span class="line">    const callbacks = this._eventMap.get(event)</span><br><span class="line">    if (!callbacks) return</span><br><span class="line">    const index = callbacks.indexOf(callback)</span><br><span class="line">    if (index !== -1) &#123;</span><br><span class="line">      callbacks.splice(index, 1)</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line">    /**</span><br><span class="line">   * 触发事件</span><br><span class="line">   */</span><br><span class="line">  private _emit(event: string, ...args: any[]) &#123;</span><br><span class="line">    const callbacks = this._eventMap.get(event)</span><br><span class="line">    if (callbacks) &#123;</span><br><span class="line">      callbacks.forEach((cb) =&gt; cb(...args))</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">    /**</span><br><span class="line">   * 主动关闭连接</span><br><span class="line">   */</span><br><span class="line">  close() &#123;</span><br><span class="line">    this._closeForce = true</span><br><span class="line">    this._clearHeartbeat()</span><br><span class="line">    this._ws?.close()</span><br><span class="line">    this._ws = null</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /**</span><br><span class="line">   * 销毁实例，关闭连接并移除所有监听</span><br><span class="line">   */</span><br><span class="line">  destroy() &#123;</span><br><span class="line">    clearInterval(this._timeout)</span><br><span class="line">    this._timeout = undefined</span><br><span class="line">    this.close()</span><br><span class="line">    this._eventMap.clear()</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /** 连接成功 */</span><br><span class="line">  private _onOpen() &#123;</span><br><span class="line">    // 不再重置 _currentReconnectTimes，否则重连成功后又归零，导致无限重连</span><br><span class="line">    this._emit(&quot;open&quot;)</span><br><span class="line">    if (this._heartbeatEnabled) &#123;</span><br><span class="line">      this.heartbeat()</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /** 收到消息 */</span><br><span class="line">  private _onMessage(ev: MessageEvent) &#123;</span><br><span class="line">    this._emit(&quot;message&quot;, ev.data)</span><br><span class="line">    if (ev) &#123;</span><br><span class="line">      // 收到心跳应答，清除超时、释放锁</span><br><span class="line">      clearTimeout(this._heartbeatIntervalTime)</span><br><span class="line">      this._isWaitingAck = false</span><br><span class="line">      return</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /** 连接错误 */</span><br><span class="line">  private _onError(ev: Event) &#123;</span><br><span class="line">    this._emit(&quot;error&quot;, ev)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /** 连接关闭 */</span><br><span class="line">  private _onClose(ev: CloseEvent) &#123;</span><br><span class="line">    this._clearHeartbeat()</span><br><span class="line">    this._ws = null</span><br><span class="line">    this._emit(&quot;close&quot;, ev)</span><br><span class="line">    if (this._closeForce) return</span><br><span class="line">    setTimeout(() =&gt; &#123;</span><br><span class="line">      this.connect()</span><br><span class="line">    &#125;, this._reconnectInterval)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  /** 清除心跳 */</span><br><span class="line">  private _clearHeartbeat() &#123;</span><br><span class="line">    if (this._heartbeatTimer) &#123;</span><br><span class="line">      clearInterval(this._heartbeatTimer)</span><br><span class="line">      this._heartbeatTimer = null</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
